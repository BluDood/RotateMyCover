name: Build RotateMyCover Mobile

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to BluApps'
        type: boolean
        default: false
      artifacts:
        description: Publish artifacts
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build Android
        run: node ./scripts/buildAndroid.mjs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.artifacts }}
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/release/app-release.apk
          archive: false
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: app/build/outputs/apk/release/app-release.apk

      - name: Publish to BluApps
        if: >-
          ${{
            (github.event_name == 'workflow_dispatch' && inputs.publish) ||
            (github.event_name == 'release' && github.event.release.prerelease == false)
          }}
        run: node ./scripts/publish.mjs
        env:
          BLUAPPS_TOKEN: ${{ secrets.BLUAPPS_TOKEN }}
          BLUAPPS_APP_ID: ${{ vars.BLUAPPS_APP_ID }}
